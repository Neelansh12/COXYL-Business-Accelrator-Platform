<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap" rel="stylesheet">
  <style>
    @keyframes buttonClick {
      0% { transform: scale(1); }
      50% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }
    .click-animation:active {
      animation: buttonClick 0.2s ease-in-out;
    }
    .coxyl-font {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
  </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center px-4">
  <div id="login-card" class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl animate__animated animate__fadeInDown">
    <div class="text-center mb-6">
      <h1 class="text-4xl font-extrabold text-indigo-800 coxyl-font">Coxyl</h1>
      <p class="text-gray-700 mt-2"><span class="font-semibold text-indigo-600">Login</span> to your account</p>
    </div>
    <form class="space-y-4" onsubmit="handleLogin(event)">
      <input type="email" placeholder="Email address" class="w-full px-4 py-3 border rounded-lg bg-gray-100 focus:ring-2 focus:ring-indigo-500" required />
      <input type="password" placeholder="Password" class="w-full px-4 py-3 border rounded-lg bg-gray-100 focus:ring-2 focus:ring-indigo-500" required />
      <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-blue-500 text-white py-3 rounded-lg hover:from-blue-500 hover:to-indigo-600 shadow-md click-animation">Log in</button>
    </form>
    <div class="text-center mt-3">
      <a href="#" class="text-sm text-indigo-700 font-semibold hover:underline" onclick="showForgotPassword()">Forgot your password?</a>
    </div>
    <div class="flex items-center my-5">
      <hr class="flex-grow border-t border-gray-300" />
      <span class="mx-2 text-gray-400 text-sm">OR</span>
      <hr class="flex-grow border-t border-gray-300" />
    </div>
    <div class="text-center text-sm mt-6 text-gray-500">
      Don’t have an account? <a href="#" class="text-indigo-600 font-semibold hover:underline" onclick="showSignUp()">Sign up</a>
    </div>
  </div>
  <div id="signup-card" class="hidden bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl animate__animated animate__fadeInUp">
    <button onclick="goBackToLogin()" class="text-gray-600 hover:text-black text-xl font-bold mb-4">&larr; Back</button>
    <div class="text-center mb-6">
      <h2 class="text-3xl font-bold text-indigo-800 coxyl-font">Sign Up</h2>
      <p class="text-gray-600 mt-1">Create a new account</p>
    </div>
    <form class="space-y-4" onsubmit="handleSignUp(event)">
      <input type="text" placeholder="Full Name" class="w-full px-4 py-3 border rounded-lg bg-gray-100 focus:ring-2 focus:ring-indigo-500" required />
      <input type="email" placeholder="Email" class="w-full px-4 py-3 border rounded-lg bg-gray-100 focus:ring-2 focus:ring-indigo-500" required />
      <input type="date" placeholder="Date of Birth" class="w-full px-4 py-3 border rounded-lg bg-gray-100 focus:ring-2 focus:ring-indigo-500" required />
      <input type="password" placeholder="Password" class="w-full px-4 py-3 border rounded-lg bg-gray-100 focus:ring-2 focus:ring-indigo-500" required />
      <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 shadow-md click-animation">Create Account</button>
    </form>
  </div>
  <div id="forgot-card" class="hidden bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl animate__animated animate__fadeInUp">
    <button onclick="goBackToLogin()" class="text-gray-600 hover:text-black text-xl font-bold mb-4">&larr; Back</button>
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-indigo-800 coxyl-font">Password Recovery</h2>
      <p class="text-gray-600 mt-1">Enter your email to receive a reset link</p>
    </div>
    <form class="space-y-4" onsubmit="handleForgotPassword(event)">
      <input type="email" placeholder="Your Email" class="w-full px-4 py-3 border rounded-lg bg-gray-100 focus:ring-2 focus:ring-indigo-500" required />
      <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 shadow-md click-animation">Send Reset Link</button>
    </form>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      alert("Logged in (simulated)");
    }

    function handleSignUp(event) {
      event.preventDefault();
      alert("Account created (simulated)");
    }

    function handleForgotPassword(event) {
      event.preventDefault();
      alert("Password reset link sent (simulated)");
    }

    function showSignUp() {
      document.getElementById("login-card").classList.add("hidden");
      document.getElementById("signup-card").classList.remove("hidden");
    }

    function showForgotPassword() {
      document.getElementById("login-card").classList.add("hidden");
      document.getElementById("forgot-card").classList.remove("hidden");
    }

    function goBackToLogin() {
      document.getElementById("signup-card").classList.add("hidden");
      document.getElementById("forgot-card").classList.add("hidden");
      document.getElementById("login-card").classList.remove("hidden");
    }
  </script>
</body>
</html>
